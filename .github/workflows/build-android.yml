name: Wanderson Android Build

on:
  workflow_dispatch:

# End-to-end CI build of Wanderson's blender_for_android port (Blender 5.3a alpha 2).
# Uses the repo's own build stack, byte-for-byte:
#   build_files/android/build_apk.sh full
# which: (1) builds host codegen tools (makesdna/makesrna/datatoc/msgfmt/shader_tool)
# with the same android_features_full.cmake feature set, (2) cross-compiles libblender.so
# via platform_android.cmake, and (3) packages the APK with build_files/android/apk/package.sh
# (aapt2 + d8 + apksigner, NO gradle).
#
# Configuration notes mirroring what the deps builder (deps/build.sh) produces:
#   - libs are harvested in `${BUILD_BASE}/lib/android_arm64`, NOT in-repo.
#   - `${LIBDIR}/.stublibs` (empty libpthread.a/librt.a) satisfies deps that emit -lpthread/-lrt
#     (bionic folds both into libc). Created here, matching deps/build.sh::stub_libs().
#   - `${LIBDIR}/vulkan/include` needs Vulkan-Headers 1.4.341 (deps/build.sh::build_vulkan_headers())
#     because the NDK ships older headers and Blender 5.3 uses newer Vulkan structs.
#   - NDK r30 (matching the official Blender Android port). The prebuilt libs from
#     projects.blender.org were compiled with NDK 30, so NDK 28 caused libc++ symbol mismatches
#     (std::__ndk1::__hash_memory missing). NDK 30 is staged directly with sdkmanager into
#     $HOME/android-sdk (folder 30.0.14904198). JDK 17 + build-tools 35.0.1 + platforms android-35.
#   - LFS objects are served anonymously by the GitHub LFS store of this fork.
#
# env.sh is intentionally NOT exported here: build_apk.sh unsets ANDROID_HOME/NDK_ROOT and derives
# them from $HOME/android-sdk. NDK 30 is staged into $ANDROID_HOME/ndk/30.0.14904198 so env.sh
# resolves ANDROID_NDK_ROOT correctly (ANDROID_NDK_VERSION is exported = 30.0.14904198).

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository (main, no LFS)
        uses: actions/checkout@v4
        with:
          path: blender
          ref: main
          lfs: false

      - name: Resolve required Git LFS files from the GitHub store
        run: |
          set -o pipefail
          cd blender
          git lfs install --local
          INCLUDE="release/datafiles/**,scripts/**,assets/**,locale/**"
          git lfs pull --include="$INCLUDE"
          echo "LFS files resolved."

      - name: Verify resolved LFS files
        run: |
          set -o pipefail
          cd blender
          SIZE_SB=$(stat -c%s release/datafiles/startup.blend)
          echo "startup.blend size: $SIZE_SB (real content, not a stub)"
          [ "$SIZE_SB" -gt 1024 ] || { echo "ERROR: startup.blend is an LFS stub"; exit 1; }
          ASSET=$(git ls-files 'assets/**/*.blend' | head -1)
          SIZE_AS=$(stat -c%s "$ASSET")
          echo "First asset $ASSET size: $SIZE_AS"
          [ "$SIZE_AS" -gt 1024 ] || { echo "ERROR: $ASSET is still an LFS stub"; exit 1; }
          echo "Assets OK."
          echo "=== remaining git modifications (should be empty) ==="
          git status --short | head -20
          echo "Required LFS files verified OK."

      - name: Resolve precompiled libs commit IDs
        id: libs-commit
        run: |
          echo "arm=$(git ls-remote https://projects.blender.org/blender/lib-android_arm64.git HEAD | cut -f1)" >> $GITHUB_OUTPUT
          echo "x64=$(git ls-remote https://projects.blender.org/blender/lib-linux_x64.git HEAD | cut -f1)" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: cache-libs-android
        with:
          path: blender_build_android/lib/android_arm64
          key: libs-android-${{ steps.libs-commit.outputs.arm }}

      - uses: actions/cache/restore@v4
        id: cache-libs-x64
        with:
          path: blender/lib/linux_x64
          key: libs-x64-${{ steps.libs-commit.outputs.x64 }}

      - name: Clone precompiled libs (Android ARM64 -- target build)
        if: steps.cache-libs-android.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          mkdir -p blender_build_android
          git clone --depth 1 https://projects.blender.org/blender/lib-android_arm64.git blender_build_android/lib/android_arm64
          cd blender_build_android/lib/android_arm64
          git lfs install
          git lfs pull

      - name: Clone precompiled libs (Linux x64 -- host codegen tools)
        if: steps.cache-libs-x64.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          git clone --depth 1 https://projects.blender.org/blender/lib-linux_x64.git blender/lib/linux_x64
          cd blender/lib/linux_x64
          git lfs install
          git lfs pull

      - uses: actions/cache/save@v4
        if: steps.cache-libs-android.outputs.cache-hit != 'true'
        with:
          path: blender_build_android/lib/android_arm64
          key: libs-android-${{ steps.libs-commit.outputs.arm }}

      - uses: actions/cache/save@v4
        if: steps.cache-libs-x64.outputs.cache-hit != 'true'
        with:
          path: blender/lib/linux_x64
          key: libs-x64-${{ steps.libs-commit.outputs.x64 }}

      - name: Verify libs
        run: |
          set -o pipefail
          SIZE_ARM=$(stat -c%s blender_build_android/lib/android_arm64/zstd/lib/libzstd.a 2>/dev/null || echo 0)
          echo "ARM64 zstd.a: $SIZE_ARM bytes"
          SIZE_X64=$(stat -c%s blender/lib/linux_x64/zstd/lib/libzstd.a 2>/dev/null || echo 0)
          echo "x64 zstd.a: $SIZE_X64 bytes"
          if [ "$SIZE_ARM" -lt 1000 ] || [ "$SIZE_X64" -lt 1000 ]; then
            echo "ERROR: LFS pointer not resolved"
            exit 1
          fi
          [ -d blender_build_android/lib/android_arm64/python/lib/python3.13 ] \
            || { echo "ERROR: python3.13 runtime missing"; exit 1; }
          echo "Both libs OK."

      - name: Patch lib layout (sse2neon include/)
        run: |
          set -o pipefail
          LIBDIR="$GITHUB_WORKSPACE/blender_build_android/lib/android_arm64"
          if [ -f "$LIBDIR/sse2neon/sse2neon.h" ] && [ ! -f "$LIBDIR/sse2neon/include/sse2neon.h" ]; then
            mkdir -p "$LIBDIR/sse2neon/include"
            cp "$LIBDIR/sse2neon/sse2neon.h" "$LIBDIR/sse2neon/include/"
          fi
          test -f "$LIBDIR/sse2neon/include/sse2neon.h" || { echo "ERROR: sse2neon layout not fixed"; exit 1; }
          echo "sse2neon OK: $(ls "$LIBDIR/sse2neon/include")"

      # NDK r30 beta1 (30.0.14904198) staged into $HOME/android-sdk as env.sh expects.
      # REQUIRED (per Simfeo's BUILDING.md, the repo this port derives from): the prebuilt libs
      # are compiled with clang 21 and reference std::__ndk1::__hash_memory, a libc++ internal
      # that NDK 28 does not provide. NDK 28 produces a link error or an APK that dies at startup.
      - name: Cache staged Android SDK
        id: cache-sdk
        uses: actions/cache/restore@v4
        with:
          path: ~/android-sdk
          key: android-sdk-30.0.14904198

      - name: Stage Android SDK ($HOME/android-sdk as env.sh expects)
        id: sdk
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/licenses"
          cp "$ANDROID_HOME/licenses/"* "$SDK/licenses/" 2>/dev/null || true
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKM" ]; then
            "$SDKM" --sdk_root="$SDK" \
              "ndk;30.0.14904198" \
              "build-tools;35.0.1" \
              "platforms;android-35" \
              "platform-tools"
          else
            echo "ERROR: sdkmanager not found at $SDKM" >&2
            exit 1
          fi
          echo "SDK staged at $SDK:"
          ls "$SDK"
          ls "$SDK/ndk"

      - uses: actions/cache/save@v4
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        with:
          path: ~/android-sdk
          key: android-sdk-30.0.14904198

      - name: Verify NDK 30
        run: |
          set -o pipefail
          NDK="$HOME/android-sdk/ndk/30.0.14904198"
          echo "NDK path: $NDK"
          cat "$NDK/source.properties" | head -5
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          [ -x "$CLANG" ] || { echo "ERROR: NDK 30 clang missing"; exit 1; }
          "$CLANG" --version | head -2
          echo "NDK 30 OK."

      - name: Install host build tools
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-14 g++-14 ninja-build pkg-config python3-dev patchelf cmake autoconf automake libtool
          gcc-14 --version | head -1
          cmake --version | head -1
          ninja --version
          patchelf --version

      - name: Setup JDK 17
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Vulkan-Headers 1.4.341 into ${LIBDIR}/vulkan/include, exactly as deps/build.sh's
      # build_vulkan_headers() installs them (the prebuilt libs only ship spirv/).
      - name: Provide Vulkan-Headers 1.4.341
        run: |
          set -o pipefail
          LIBDIR="$GITHUB_WORKSPACE/blender_build_android/lib/android_arm64"
          VK="$LIBDIR/vulkan/include"
          if [ ! -f "$VK/vulkan/vulkan_core.h" ]; then
            curl -sL --max-time 300 -o /tmp/vulkan-headers.tar.gz \
              https://github.com/KhronosGroup/Vulkan-Headers/archive/refs/tags/vulkan-sdk-1.4.341.0.tar.gz
            tar -xf /tmp/vulkan-headers.tar.gz -C /tmp
            mkdir -p "$VK"
            cp -R /tmp/Vulkan-Headers-*/include/vulkan "$VK/"
            cp -R /tmp/Vulkan-Headers-*/include/vk_video "$VK/"
            rm -rf /tmp/Vulkan-Headers-*
          fi
          grep "#define VK_HEADER_VERSION " "$VK/vulkan/vulkan_core.h"
          test -f "$VK/vk_video/vulkan_video_codec_av1std.h" \
            || { echo "ERROR: vk_video headers missing"; exit 1; }

      - name: Build FFmpeg codec deps + FFmpeg with PIC
        run: |
          set -o pipefail
          cd blender
          echo "=== Building FFmpeg codec dependencies ==="
          bash build_files/android/deps/build.sh \
            openjpeg ogg vorbis theora opus lame aom x265 vpx x264
          echo "=== Building FFmpeg (with PIC) ==="
          bash build_files/android/deps/build.sh ffmpeg
          LIBDIR="$GITHUB_WORKSPACE/blender_build_android/lib/android_arm64"
          NDK="$HOME/android-sdk/ndk/30.0.14904198"
          echo "=== Validating libavutil PIC ==="
          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-nm" \
            --print-file-type "$LIBDIR/ffmpeg/lib/libavutil.a" 2>/dev/null | grep -c "ABS" || true
          echo "FFmpeg + codec deps built with PIC."

      # Empty stub archives for -lpthread/-lrt (bionic folds both into libc).
      # Mirrors deps/build.sh::stub_libs() byte-for-byte.
      - name: Create .stublibs
        run: |
          set -o pipefail
          LIBDIR="$GITHUB_WORKSPACE/blender_build_android/lib/android_arm64"
          STUB="$LIBDIR/.stublibs"
          NDK="$HOME/android-sdk/ndk/30.0.14904198"
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android31-clang"
          AR="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          [ -x "$CLANG" ] || { echo "ERROR: NDK clang missing"; exit 1; }
          mkdir -p "$STUB"
          echo "" > /tmp/stub_empty.c
          "$CLANG" -c /tmp/stub_empty.c -o /tmp/stub_empty.o
          "$AR" rcs "$STUB/libpthread.a" /tmp/stub_empty.o
          "$AR" rcs "$STUB/librt.a" /tmp/stub_empty.o
          rm -f /tmp/stub_empty.c /tmp/stub_empty.o
          ls -la "$STUB"
          [ -d "$LIBDIR/draco" ] || { echo "ERROR: draco missing from libs"; exit 1; }

      - name: Build APK (build_apk.sh full)
        run: |
          set -o pipefail
          cd blender
          export JAVA_HOME="${{ steps.setup-java.outputs.path }}"
          export ANDROID_NDK_VERSION="30.0.14904198"
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_API=31
          bash build_files/android/build_apk.sh full 2>&1 | tee "$GITHUB_WORKSPACE/build_apk.log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-apk
          path: blender_build_android/android_apk_stage_full/blender-full.apk
          retention-days: 14
          if-no-files-found: error

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_apk.log
            blender_build_android/build_host_tools_full/CMakeCache.txt
            blender_build_android/build_android_full/CMakeCache.txt
            blender_build_android/**/*.log
          if-no-files-found: ignore
